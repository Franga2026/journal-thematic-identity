name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install dataset stubs for CI
        run: VERIFY_CI_STUBS=1 node scripts/install-ci-stubs.mjs

      - name: Verify dataset files exist
        run: npm run verify:data:stubs

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Run tests
        run: npx vitest run --reporter=verbose

      - name: Build
        run: npm run verify:data:stubs && vite build

      - name: Check bundle size
        run: |
          echo "=== Bundle Size ==="
          du -sh dist/assets/*.js | sort -rh | head -10
          TOTAL=$(du -sh dist/ | cut -f1)
          echo "Total: $TOTAL"

